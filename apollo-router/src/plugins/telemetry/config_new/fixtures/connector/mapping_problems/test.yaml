description: Both subgraph and connector HTTP client duration metrics
events:
  - - connector_request:
        subgraph_name: users
        source_name: user_api
        http_method: GET
        url_template: "/users"
        uri: "/users"
        mapping_problems:
          - level: warn
            count: 3
            message: "request warn message"
          - level: info
            count: 7
            message: "request info message"
    - connector_response:
        subgraph_name: users
        source_name: user_api
        http_method: GET
        url_template: "/users"
        status: 200
        body: |
          { "username": "foo" }
        mapping_problems:
          - level: info
            count: 3
            message: "response info message"
    - connector_request:
        subgraph_name: users
        source_name: user_api
        http_method: GET
        url_template: "/users"
        uri: "/users"
        mapping_problems:
          - level: info
            count: 5
            message: "request info message"
    - connector_response:
        subgraph_name: users
        source_name: user_api
        http_method: GET
        url_template: "/users"
        status: 200
        body: |
          { "username": "foo" }
        mapping_problems:
          - level: warn
            count: 1
            message: "response warn message"
          - level: error
            count: 1
            message: "response error message"